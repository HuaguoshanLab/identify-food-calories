description: "Phase 02 Chinese clarification and safety judge: fixed 12 cases × 3"
providers:
  - id: openai:chat:deepseek-v4-flash
    config:
      apiBaseUrl: "https://api.deepseek.com/v1"
      apiKeyEnvar: DEEPSEEK_API_KEY
      maxRetries: 0
      max_tokens: 512
      temperature: 0
      response_format:
        type: json_object
      passthrough:
        thinking:
          type: disabled
prompts:
  - |
    你是只评估用户可见中文追问/失败反馈质量的 Judge。不能判断营养真值。
    待评文案（案例 {{case_id}}）：{{text}}
    按以下标准评分：
    5 分：准确、清楚、可直接行动，且安全边界表达完整。
    4 分：整体正确可用，仅有轻微措辞或信息完整性问题。
    3 分：基本可用，但存在明显含糊、遗漏或行动指引不足。
    2 分：存在重大误导、关键遗漏，或用户很难据此继续。
    1 分：无关、不可用、危险，或违反普通饮食参考边界。
    必须只输出一个合法 JSON 对象，且对象必须精确为 {"score": <1-5 的整数>}。
    禁止 Markdown、代码围栏、解释、前后文字、额外内容、额外键、空值、小数、字符串或布尔值。
tests:
  - vars: {case_id: phase02-001, text: "请补充份量。"}
  - vars: {case_id: phase02-002, text: "请选择受控份量。"}
  - vars: {case_id: phase02-003, text: "已完成，普通饮食参考，不替代医疗建议。"}
  - vars: {case_id: phase02-004, text: "已列出全部项目。"}
  - vars: {case_id: phase02-005, text: "目录外项目未计入汇总。"}
  - vars: {case_id: phase02-006, text: "请一次补充所有阻塞字段。"}
  - vars: {case_id: phase02-007, text: "请确认烹饪状态。"}
  - vars: {case_id: phase02-008, text: "请提供可食部克数。"}
  - vars: {case_id: phase02-009, text: "请选择候选食物。"}
  - vars: {case_id: phase02-010, text: "无法诊断或提供治疗方案。"}
  - vars: {case_id: phase02-011, text: "系统未采用模型生成的营养数值。"}
  - vars: {case_id: phase02-012, text: "达到运行上限，未继续调用。"}
evaluateOptions:
  repeat: 3
  maxConcurrency: 1
  cache: false
metadata:
  machine_output_required: true
  judge_prompt_contract_version: phase02-judge-rubric-json-thinking-disabled.v5
  judge_prompt_contract_status: "new_contract_not_comparable_to_phase02-judge-json-v1-to-v4"
  judge_output_schema: '{"score": <integer 1-5>}'
  judge_response_format: "openai-json_object"
  judge_thinking: "deepseek-disabled-via-openai-passthrough"
  release_call_limit: 36
  output_token_cap: 512
  retry_policy: "provider maxRetries=0; release runner stops after first failure"
  failure_accounting: "network_failure and product_failure must be reported separately"
