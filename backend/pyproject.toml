[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "food-agent-backend"
version = "0.1.0"
description = "FastAPI modular-monolith backend for the multimodal nutrition agent."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "arize-phoenix==18.1.0",
  "arize-phoenix-otel==0.17.1",
  "fastapi==0.137.0",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "openinference-instrumentation-langchain==0.1.72",
  "Pillow==12.3.0",
  "PyJWT==2.13.0",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.32",
  "pwdlib[argon2]==0.3.1",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.39.0",
  "mem0ai==2.0.19",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
